support:
  heading: 'Jeder Beitrag hält VersaTiles unabhängig.'
  text: 'Möchtest du VersaTiles direkt unterstützen? Jeder Beitrag hilft, die Weiterentwicklung zu sichern und VersaTiles unabhängig zu halten. Ob einmalig oder regelmäßig:'
faq:
  heading: 'Häufig gestellte Fragen'
  items:
    - q: 'Was kostet die Mitgliedschaft und wann wird der Betrag fällig?'
      a: |-
        700 € pro Monat, also 8.400 € pro Jahr (netto, zzgl. USt.), fällig als Jahresbeitrag. Der Beitrag wird erst fällig, wenn das Konsortium gegründet ist.

    - q: 'Was passiert, wenn sich nicht zehn Organisationen zusammenfinden?'
      a: |-
        Dann wird nicht gegründet und es muss auch niemand etwas zahlen. Zehn Mitglieder sind die Schwelle, ab der das Budget den Betrieb und die Weiterentwicklung trägt. Darunter wäre das Versprechen nicht zu halten.
        VersaTiles würde dadurch jedoch nicht verschwinden, da der Code und die Daten offen sind und es auch bleiben werden. Ohne Finanzierung würde das Projekt stillstehen und es gäbe keine Updates mehr für Software und Kartendaten.

    - q: 'Woran binden wir uns, und wie kommen wir wieder raus?'
      a: |-
        Die Satzung beschließt die Gründungsversammlung, also wir gemeinsam. Mein Vorschlag für die Satzung: Die Mitgliedschaft ist zum Jahresende kündbar. Die Mitgliedsbeiträge werden einmal jährlich fällig.

    - q: 'Was erhält man für den Mitgliedsbeitrag?'
      a: |-
        1. Karten-Hosting: Allen Mitgliedern steht eine betriebsfertige Karteninfrastruktur zur freien Nutzung zur Verfügung.
        2. Mitentscheidungsrecht, in welche Richtung VersaTiles weiterentwickelt wird. Dazu gehört beispielsweise die Festlegung der Höhe von Mitgliedsbeiträgen, der Fokus auf Qualitätssicherung, IT-Sicherheit oder neue Features sowie die Festlegung von technischen Spezifikationen.
        3. Beständigkeit: Die Weiterentwicklung von VersaTiles ist langfristig gesichert und liegt nicht in der Hand eines Anbieters, der sie einstellen, verkaufen oder verteuern kann.
        4. Sichtbarkeit als Organisation, die digitale Souveränität nicht nur wünscht, sondern auch lebt.

    - q: 'Wo stehen die Server, und ist das datenschutzkonform?'
      a: |-
        Welcher Anbieter es wird, entscheiden die Mitglieder.
        Ebenso entscheiden sie, wie mit Zugriffsdaten umgegangen wird, ob und wie lange Logs aufbewahrt werden, und ob ein Vertrag zur Auftragsverarbeitung nach Art. 28 DSGVO angeboten werden soll. Diese Fragen gemeinsam zu beantworten, statt sie von einem Anbieter vorgesetzt zu bekommen, ist einer der Gründe für das Konsortium.
        Unabhängig davon gilt: Weil VersaTiles Open Source ist, kann jede Organisation es auch im eigenen Haus betreiben – dann verlassen die Daten das eigene Rechenzentrum nie.

    - q: 'Wir nutzen VersaTiles doch bereits kostenlos. Warum sollten wir also dafür zahlen?'
      a: |-
        Genau das ist die Frage, an der offene Infrastrukturen immer wieder scheitern. VersaTiles ist frei nutzbar und wird es auch bleiben. Aber Server, Kartendaten und Weiterentwicklung kosten Geld. Nur mit finanzieller Unterstützung kann das Projekt langfristig bestehen.
        Anders ausgedrückt: Wer seinen Garten nicht gießt, darf sich nicht wundern, wenn alles eingeht.

    - q: 'Wer entscheidet im Konsortium?'
      a: |-
        Das Konsortium ist ein eingetragener Verein. Jedes Mitglied hat eine Stimme – unabhängig von der Größe der Organisation. Ein öffentlich-rechtlicher Sender hat somit das gleiche Gewicht wie eine Behörde oder ein mittelständisches Unternehmen. Die Gründungsmitglieder erstellen die Satzung gemeinsam.

    - q: 'Warum ein Verein und keine GmbH?'
      a: |-
        Weil eine GmbH Anteilseigner hat – und was Anteile hat, kann gekauft werden. Genau das ist das Problem, das wir lösen wollen. Eine Infrastruktur, auf die sich Redaktionen, Behörden und Unternehmen verlassen, darf nicht verkäuflich sein. Sie darf nicht übernommen und auf Rendite getrimmt werden. Ein Verein hat keine Eigentümer, sondern Mitglieder. Es gibt nichts zu verkaufen.
        Hinzu kommt die Frage der Macht: In einer GmbH richten sich die Stimmen nach dem Kapital – wer am meisten zahlt, entscheidet am meisten. In einem Verein hat dagegen jedes Mitglied eine Stimme, unabhängig von seiner Größe. Überschüsse werden nicht ausgeschüttet, sondern fließen zurück in die Entwicklung und den Betrieb.
        Auch aus praktischer Sicht ist der Verein der leichtere Weg: Eine Mitgliedschaft kann beschlossen und zum Jahresende gekündigt werden. Ein Gesellschaftsanteil müsste hingegen erworben, bewertet und irgendwann wieder veräußert werden – ein Vorgang, der eine Zusage durch eine Behörde eher verhindert als ermöglicht.
        Sollte der Betrieb später eine operative Gesellschaft erfordern, kann der Verein eine solche Gesellschaft gründen und sie vor feindlichen Übernahmen schützen. Die Rechte an VersaTiles blieben in jedem Fall beim Verein.

    - q: 'Inwieweit ist VersaTiles von einzelnen Personen abhängig?'
      a: |-
        VersaTiles wurde von Michael Kreil begonnen und wird bis heute im Kern von ihm entwickelt. Fiele er aus, stünde das Projekt still. Das ist das größte Risiko des Projekts und der Hauptgrund für die Gründung des Konsortiums.
        Mittelfristig muss sichergestellt werden, dass mindestens drei Personen die Weiterentwicklung von VersaTiles überblicken und verantworten können. Dies ist eine der ersten Aufgaben, die das Konsortium gemeinsam angehen muss.

    - q: 'Wofür werden die Mitgliedsbeiträge noch verwendet?'
      a: |-
        Die Beiträge fließen hauptsächlich in die Weiterentwicklung von VersaTiles und in den Betrieb der Infrastruktur. Mittelfristig muss jedoch auch sichergestellt werden, dass wichtige Open-Source-Komponenten ebenfalls finanziell unterstützt werden können, beispielsweise durch Spenden an die [OpenStreetMap Foundation](https://osmfoundation.org/), an [MapLibre](https://maplibre.org/sponsors/) und an [Mapterhorn](https://mapterhorn.com/).
        Letztlich entscheiden die Mitglieder gemeinsam über die Verwendung der Mittel.
  contactText: 'Eine Frage, die hier fehlt?'
  contactCta: 'Schreib mir'
footer: 'VersaTiles ist ein Open-Source-Projekt.'
