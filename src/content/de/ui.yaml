chart:
  title: |-
    Je mehr User eine Karte aufrufen, desto teurer wird sie.
    Außer im VersaTiles-Konsortium.
  axisX: 'Kartenaufrufe pro Monat'
  axisY: 'Kosten pro Monat'
  note: 'Während kommerzielle Anbieter pro Kartenaufruf abrechnen, erhebt das Konsortium einen festen Monatsbeitrag, in dem Hosting, Administration und Weiterentwicklung inklusive sind. Ab einer Million Aufrufen veröffentlichen Mapbox und MapTiler keine Preise mehr. Große Kunden verhandeln individuell und erhalten Rabatte. Die gestrichelten Linien zeigen die fortgeschriebenen Listenpreise.'
  consortiumName: 'VersaTiles-Konsortium'
  listPriceLimit: 'Ende der Preisliste'
