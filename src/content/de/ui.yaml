meta:
  title: 'VersaTiles-Konsortium – Digitale Souveränität bei Karten'
  description: 'Karten sind Infrastruktur. Wir suchen zehn Organisationen, die ihre Karteninfrastruktur mit uns gemeinsam betreiben – Europas erstes nutzergetragenes, offenes Kartenkonsortium. Für echte digitale Souveränität.'
  ogImage:
    line1: 'Open-Source-Software ist Infrastruktur.'
    line2: 'Alle können sie nutzen.'
    line3: 'Jemand muss sie finanzieren.'
    sub: 'Zehn Organisationen. Ein Konsortium. Freie Karten für alle.'
hero:
  kicker: 'Open Source ist Infrastruktur. Jemand muss sie finanzieren.'
  title1: |-
    Digitale Souveränität,
    die sich rechnet.
  title2: |-
    Ein Open-Source-Konsortium für~Karten.
  lead: 'Derzeit beziehen viele Redaktionen, Behörden und Unternehmen ihre Webkarten von großen, teuren Anbietern außerhalb des EU-Rechtsraums. Unser Open-Source-Projekt „VersaTiles” beweist, dass es auch rechtssicher und hundertmal wirtschaftlicher geht. Wir suchen zehn Organisationen, die mit uns das erste nutzergetragene Konsortium für digitale Infrastruktur in Europa gründen möchten.'
  ctaPrimary: 'Zum Aufruf'
  ctaSecondary: 'VersaTiles ansehen'
