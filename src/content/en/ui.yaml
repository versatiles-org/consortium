meta:
  title: 'VersaTiles Consortium – Break free from the platform economy'
  description: 'Maps are infrastructure. We are looking for ten organisations to found the first European open-source map consortium with us – for real digital sovereignty.'
  ogImage:
    line1: 'Open source software is infrastructure.'
    line2: 'Everyone can use it.'
    line3: 'Somebody has to fund it.'
    sub: 'Ten organisations. One consortium. Open maps for everyone.'
hero:
  kicker: 'Open source is infrastructure. Somebody has to fund it.'
  title1: 'Break free from the platform economy.'
  title2: "Let's make infrastructure open and shared again."
  lead: 'Maps are infrastructure today – yet almost everyone rents them from a handful of large, overpriced platforms. VersaTiles shows that it can be open, independent and many times cheaper. We are now looking for ten organisations to found the first European open-source map consortium with us – for real digital sovereignty.'
